services:
  postgres:
    image: postgres:17-alpine
    container_name: ubop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ubop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ubop_network

  redis:
    image: redis:7-alpine
    container_name: ubop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ubop_network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ubop-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/ubop
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ubop_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ubop-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - ubop_network

volumes:
  postgres_data:
    driver: local

networks:
  ubop_network:
    driver: bridge
