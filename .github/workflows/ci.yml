name: UBOP CI (Backend, Frontend & Security)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check app tests

      - name: Run Test Suite
        run: |
          pytest tests --verbose

  frontend-ci:
    name: Frontend CI (React / TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Install workspace dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build & Typecheck Frontend
        run: |
          pnpm --filter ubop-web build

  security-scan:
    name: Security & SAST Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Bandit & Pip-Audit
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit SAST on Backend
        run: |
          bandit -r apps/api/app -c apps/api/pyproject.toml

      - name: Run Pip-Audit Dependency Vulnerability Check
        run: |
          pip-audit -r apps/api/requirements.txt --ignore-vuln CVE-2024-0000 || true

      - name: Setup pnpm for Node Security Audit
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Run pnpm Audit
        run: |
          pnpm audit --prod || true
